name: main

on:
  workflow_dispatch:
    inputs:
      runs-on:
        type: choice
        description: 'The runner pool to run the job on'
        required: true
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-slim
          - macos-26
          - macos-15
          - macos-15-intel
          - macos-14
          - windows-2025
          - windows-2022
          - windows-11-arm
      container-runs-on:
        type: choice
        description: 'The Docker container to run the job on (this overrides the `runs-on` input)'
        required: false
        default: '(none)'
        options:
          - '(none)'
          - fedora:latest
          - archlinux:latest
          - ubuntu:latest
      limit-access-to-actor:
        type: choice
        description: 'Whether to limit access to the actor only'
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'

jobs:
  test:
    if: ${{ inputs.container-runs-on == '(none)' }}
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: msys2/setup-msys2@v2
        if: ${{ inputs.runs-on == 'windows-11-arm' }}
        with:
          msystem: 'CLANGARM64'
          location: C:\.\

      - name: Load SSH key
        if: ${{ !startsWith(inputs.runs-on, 'windows') }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone my private repo
        if: ${{ !startsWith(inputs.runs-on, 'windows') }}
        shell: bash
        run: |
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:gajaja578/myproject2.git ~/myproject2

      - name: Setup upterm session
        id: upterm
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: ${{ inputs.limit-access-to-actor }}
          detached: true

      # 6 小时保活：让 job 不结束，runner 不被回收
      - name: Keep job alive for 6 hours
        if: ${{ !startsWith(inputs.runs-on, 'windows') }}
        shell: bash
        run: |
          echo "Job 保活中，6 小时后自动结束..."
          sleep 21600

      - name: Save SSH command to file
        if: steps.upterm.outputs.ssh-command
        shell: bash
        run: |
          echo "${{ steps.upterm.outputs.ssh-command }}" > ssh-command.txt

      - name: Upload SSH command
        if: steps.upterm.outputs.ssh-command
        uses: actions/upload-artifact@v4
        with:
          name: ssh-command
          path: ssh-command.txt